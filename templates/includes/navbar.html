{% load static %}
<!--Main Wrapper-->
<div class="wrapper">
<!-- Header Start -->
<header id="header">
<div class="main-header">
<div class="container-fluid">
<div class="row">
<div class="col-lg-8 col-md-8 col-sm-12 col-xs-12">
<div class="logo">
<figure>
	<a href="{% url 'home' %}" class="light-logo">
		<img src="{% static 'logo/logos.png' %}" alt="quickcart" width="230" margin-bottom="20" >
	</a>
</figure>
</div>



<div class="main-location ml-5">
<ul>
	<li class="location-has-children choose-location">
		<form action="#">
			<input type="text" value="" name="location" id="location" placeholder="Your current location" autocomplete="off">
			<span id="foodbakery_radius_location_open" class="foodbakery-radius-location"><i class="icon-target5" onclick="getLocation()"></i></span>
		</form>
		
	</li>
</ul>
</div>
</div>
<div class="col-lg-4 col-md-4 col-sm-12 col-xs-12">
<div class="login-option">
				{% if user.is_authenticated %}
				<a href="{% url 'cart' %}">
					<i class="fa fa-shopping-cart text-danger" style="font-size: 20px;"></i>
					<span class="badge badge-warning" id="cart_counter" style="border-radius: 50px; position: relative; bottom:10px; left: -5px;">{{ cart_count }}</span>
				</a>
				{% endif %}



	<a href="{% url 'marketplace' %}" class="btn btn-outline-danger text-uppercase font-weight-bold" data-target="#sign-in">Marketplace</a>

	{% if user.is_authenticated %}

<a class="cs-color cs-popup-joinus-btn login-popup" data-target="#sign-in" href="{% url 'myAccount' %}">My Account </a>	
<a class="cs-color cs-popup-joinus-btn login-popup text-danger" data-target="#sign-in" href="{% url 'logout' %}">Logout </a> 

{% else %}
<a class="cs-color cs-popup-joinus-btn login-popup" data-target="#sign-in" href="{% url 'login' %}">Login </a> /

<span><a href="{% url 'registerUser' %}" class="cs-color cs-popup-joinus-btn login-popup ml-0">Register</a></span><a class="get-start-btn" href="{% url 'registerShop' %}">
	Register
	Shop </a>
	{% endif %}
</div>
</div>
</div>
</div>
</div>
</header>
<!-- Header End -->

<script>
const x = document.getElementById("location");
var current_location=sessionStorage.getItem("current_location")

if(current_location!=""){
	x.value=current_location;
}

function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(success, error);
  } else { 
    x.innerHTML = "Geolocation is not supported by this browser.";
  }
}

function success(position) {
    var lat=position.coords.latitude
	var lng=position.coords.longitude

   // hit AJAX request to googlemaps api endpoint and get the location data using those lat and lng
   var GOOGLE_API_KEY="{{ GOOGLE_API_KEY }}"
   var url="https://maps.googleapis.com/maps/api/geocode/json?latlng="+lat+","+lng+"&key="+GOOGLE_API_KEY

   fetch(url)
        .then(function(response){
            if (!response.ok) {
                throw new Error('Geocode request failed');
            }
            return response.json();
        })
        .then(function(data){
            if (data.results && data.results.length > 0) {
                var current_location = data.results[0].formatted_address;
                x.value = current_location;
                sessionStorage.setItem("current_location", current_location);
                window.location = '?lat='+lat+'&lng='+lng;
            } else {
                throw new Error('No geocode result');
            }
        })
        .catch(function(err){
            console.error(err);
            alert('Unable to detect location. Please enter it manually.');
        });
}

function error() {
  alert("Sorry, no position available.");
}
</script>
