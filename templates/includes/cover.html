{% load static %}

<div class="page-section restaurant-detail-image-section" {% if shop.user_profile.cover_photo %}style=" background: url({{shop.user_profile.cover_photo.url}}) no-repeat scroll 0 0 / cover;"{% else %}style=" background: url({% static 'images/default-cover.PNG' %}) no-repeat scroll 0 0 / cover;"{% endif %}>
<!-- Container Start -->
<div class="container">
<!-- Row Start -->
<div class="row">
<!-- Column Start -->
<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
<div class="company-info-detail">
<div class="company-info">
<div class="img-holder">
<figure>
{% if shop.user_profile.profile_picture %}
<img src="{{shop.user_profile.profile_picture.url}}" alt="">
{% else %}
<img src="{% static 'images/default-profile.PNG' %}" alt="No Profile Picture">
{% endif %}
</figure>
</div>

<div class="text-holder">
<span class="restaurant-title">{{shop.owner_name}}</span>
<div class="text">
    {% if shop.user_profile.address %}
<i class="icon-location"></i>

<p>{{shop.user_profile.address}}</p>

    {% endif %}
</div>
</div>
</div>
</div>
</div>
<!-- Column End -->
</div>
<!-- Row End -->
</div>
<!-- Container End -->
</div>
