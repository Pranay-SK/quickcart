services:
  - type: web
    name: quickcart
    runtime: python
    buildCommand: apt-get update && apt-get install -y gdal-bin libgdal-dev libgeos-dev libproj-dev && pip install -r requirements.txt && pip install "GDAL==$(gdal-config --version)"
    startCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn quickcart.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quickcart-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: RENDER_EXTERNAL_HOSTNAME
        fromService:
          type: web
          name: quickcart
          property: host
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: RZP_KEY_ID
        sync: false
      - key: RZP_KEY_SECRET
        sync: false

databases:
  - name: quickcart-db
    databaseName: quickcart
    user: quickcart
    plan: free